name: pawcity
description: Pet-Friendly Urban Spots Finder
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Analytics
  posthog_flutter: ^4.0.0

  # Maps
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.2
  video_player: ^2.8.6
  chewie: ^1.8.3
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  flutter_image_compress: ^2.2.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0

  # Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2

  # UI Utilities
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  badges: ^3.1.2
  dotted_border: ^2.1.0
  fl_chart: ^0.68.0

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  intl: ^0.20.2
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/pc.png
    - .env
