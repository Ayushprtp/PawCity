<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-background min-h-screen flex flex-col items-center justify-center p-4 antialiased">
<!-- Main Card Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.06)] overflow-hidden flex flex-col relative">
<!-- Decorative Top Graphic -->
<div class="h-32 bg-gradient-to-br from-primary to-primary-container relative overflow-hidden rounded-t-xl">
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 20% 150%, white 0%, transparent 50%);"></div>
</div>
<!-- Success Icon Avatar (Overlapping) -->
<div class="flex justify-center -mt-12 relative z-10">
<div class="bg-surface-container-lowest p-2 rounded-full shadow-[0_10px_20px_rgba(0,0,0,0.05)]">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Content Section -->
<div class="px-6 pt-6 pb-8 flex flex-col items-center text-center space-y-6">
<!-- Headline -->
<div class="space-y-2">
<h1 class="text-3xl font-headline font-bold text-primary tracking-tight">Booking Confirmed!</h1>
<p class="text-on-surface-variant font-body text-sm">Your vet appointment for <span class="font-semibold text-on-surface">Bella</span> is set.</p>
</div>
<!-- Appointment Details Card -->
<div class="w-full bg-surface-container-low rounded-lg p-5 text-left space-y-4">
<!-- Doctor/Clinic -->
<div class="flex items-start space-x-4">
<div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0">
<img alt="Doctor Profile" class="w-full h-full object-cover" data-alt="Close up portrait of a friendly female veterinarian in scrubs smiling warmly in a bright clinic setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwwGdoGE-cSfmQCg9p1El3HJPAWUbegJ5PwAMJifmKbzSqDI537Q73a_TeBbaWRC4wCArmf7pK7bNiG4_aju2mbXSKyLE5broJCuTTz9aQ6uzdhZzrVQlZUzs3_nDN-aP-2-8nXlJq_YNgFw5BlXiOuvGIYCjDZDHzEDp2Rni4yxc80wefHa2JQtC2fHoBusJYSQYLGNyAm70GBjqEO4yTl7NnvSacq8OIXTv5Ys9vX1alkR3BUPjjhLXVOZVOHthb8aVGIir7CQU"/>
</div>
<div>
<h2 class="font-headline font-bold text-on-surface text-lg">Dr. Sarah Jenkins</h2>
<p class="font-body text-secondary text-sm font-medium">Paws &amp; Claws Clinic</p>
</div>
</div>
<!-- Divider -->
<div class="border-t border-outline-variant/20 pt-4 mt-4 grid grid-cols-2 gap-4">
<!-- Date -->
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-xl" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<div>
<p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-0.5">Date</p>
<p class="font-body font-semibold text-on-surface text-sm">Oct 24, 2023</p>
</div>
</div>
<!-- Time -->
<div class="flex items-center space-x-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-xl" style="font-variation-settings: 'FILL' 1;">schedule</span>
</div>
<div>
<p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-0.5">Time</p>
<p class="font-body font-semibold text-on-surface text-sm">10:30 AM</p>
</div>
</div>
</div>
<!-- Location -->
<div class="flex items-center space-x-3 pt-2">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-tertiary-container text-xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-0.5">Address</p>
<p class="font-body font-semibold text-on-surface text-sm">124 Maple Street, Paw City</p>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full space-y-3 pt-2">
<button class="w-full bg-gradient-to-r from-primary to-primary-dim text-on-primary font-headline font-semibold py-4 rounded-full shadow-[0_8px_20px_rgba(172,45,94,0.15)] hover:scale-[0.98] active:scale-95 transition-transform flex items-center justify-center space-x-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">event</span>
<span>Add to Calendar</span>
</button>
<button class="w-full bg-secondary-container text-on-secondary-container font-headline font-semibold py-4 rounded-full hover:bg-secondary-fixed active:scale-95 transition-all">
                    View My Appointments
                </button>
</div>
</div>
</main>
</body></html>
