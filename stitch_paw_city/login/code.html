<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Paw City - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",

                    "surface-container-lowest": "#ffffff",
                    "primary-dim": "#9c1f52",
                    "on-surface-variant": "#5a6062",
                    "surface-tint": "#ac2d5e",
                    "secondary-fixed-dim": "#b5d8ff",
                    "on-error": "#fff7f7",
                    "error": "#ac3149",
                    "secondary-container": "#cfe5ff",
                    "on-primary-fixed-variant": "#890c44",
                    "on-surface": "#2e3335",
                    "inverse-surface": "#0c0f10",
                    "error-container": "#f76a80",
                    "surface-dim": "#d5dbdd",
                    "secondary": "#00639f",
                    "on-tertiary": "#fff7f3",

                    "on-background": "#2e3335",
                    "surface": "#f8f9fa",

                    "tertiary": "#845500",
                    "surface-container": "#ebeef0",
                    "outline-variant": "#aeb3b5",
                    "on-tertiary-fixed": "#3d2500",
                    "error-dim": "#770326",
                    "tertiary-fixed-dim": "#eea840",
                    "on-secondary": "#f7f9ff",
                    "surface-variant": "#dee3e5",
                    "outline": "#767c7e",
                    "primary": "#ac2d5e",
                    "tertiary-container": "#feb64c",
                    "primary-fixed-dim": "#ff92b2",

                    "surface-bright": "#f8f9fa",
                    "secondary-dim": "#00578c",
                    "on-primary-container": "#7c003b",
                    "on-primary": "#fff7f7",
                    "tertiary-fixed": "#feb64c",
                    "on-tertiary-fixed-variant": "#644000",
                    "on-secondary-fixed": "#00426c",
                    "inverse-primary": "#fd6c9c",
                    "surface-container-high": "#e5e9eb",
                    "primary-fixed": "#ffa8c0",
                    "on-primary-fixed": "#550027",
                    "tertiary-dim": "#744a00",
                    "inverse-on-surface": "#9b9d9e"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans", "sans-serif"],
                    "body": ["Plus Jakarta Sans", "sans-serif"],
                    "label": ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      }

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<!-- Content Canvas -->
<main class="flex-grow flex items-center justify-center p-4 md:p-8 relative overflow-hidden">
<!-- Decorative Background Blob -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
<!-- Login Card Container -->
<div class="w-full max-w-5xl flex flex-col md:flex-row bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_-15px_rgba(46,51,53,0.06)] overflow-hidden relative z-10">
<!-- Image Section (Asymmetrical overlap feel on Web) -->
<div class="w-full md:w-1/2 h-64 md:h-auto relative overflow-hidden hidden md:block">
<img alt="Happy dog" class="w-full h-full object-cover rounded-tl-xl rounded-bl-xl md:rounded-bl-xl md:rounded-tr-none" data-alt="Close up portrait of a happy, attentive beagle dog sitting outdoors in soft warm natural lighting with a blurred green background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCyjROkR2GO5wN14gkoiIK--jG8MW3Vq6hbH9gyX3Nlyz0oVOXPzoxe8QERuO9LlFYhFhU6QoOZgPTSbv_TCxk6srP3yS0PDo_uk1rPYf4UVxKsVKYZVPVWZ2MvPh3frqbW1FsAWaInBHq8iSimz1EGHmGiuz1edKvY8JsmNayYf2WwWIJIsCUiQ4d2QUxNmwarVd_WCikdqs1HLf30s-UZaIgTe32GFur0zbmE7QASY1yRbykRj6bVzdK7mD2dvZz4uEmCPcLL0DA"/>
<!-- Subtle gradient overlay to blend image edge -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent to-surface-container-lowest/80 md:block hidden"></div>
</div>
<!-- Mobile Image Header -->
<div class="w-full h-48 relative overflow-hidden md:hidden">
<img alt="Happy dog" class="w-full h-full object-cover rounded-tl-xl rounded-tr-xl" data-alt="Close up portrait of a happy, attentive beagle dog sitting outdoors in soft warm natural lighting with a blurred green background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOEHjm--XfaM7XSEf9CRdvVKyW3xuuSwKAyCCWGdmaA4kvWSj4-wKx188GVrMy9lxw7FQu2D7jY7mXpPYtFCKbZx523W7vJwEcLtNK5g1-4_ZIHd3Jbf69thZrVCdsECnqGWpJVEQhD-DzrZhuwUu6NyP98YhO-onmMC_tnPq3I-sp7K5PQB25EFPjsonL63_LfdVPOauIVqgGvAM_vU_R1zpuxSMHvt7TWBlTzhvy-O6FMN5FxkyoFuNspn_AfOPVg9YFi2UpKvI"/>
</div>
<!-- Form Section -->
<div class="w-full md:w-1/2 p-8 md:p-12 lg:p-16 flex flex-col justify-center glass-panel md:bg-transparent md:backdrop-filter-none">
<div class="mb-10">
<h1 class="font-headline text-4xl md:text-5xl font-extrabold text-primary mb-2 tracking-tight">Welcome Back!</h1>
<p class="font-body text-on-surface-variant text-sm md:text-base">Sign in to manage your pet's care and connect with the community.</p>
</div>
<!-- Social Logins -->
<div class="space-y-4 mb-8">
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container text-on-surface py-3.5 px-4 rounded-full transition-colors duration-200 group">
<img alt="Google" class="w-5 h-5 group-hover:scale-110 transition-transform" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0kKJPdOxT5mRvDFDiy5ofS-lMsDkxVx31i-2CU3aQzhhuOnSe4Vk4_h5j97m_aTd2-wJfICxRIq-Kstv5HP6asRbPsMTybTfDkYPNJz1i_fajDzNYc5SRJb5d-HirVVzStdsXsLE-mkauT1XCRneWZa5uhxZ3dLrdrdncdHkZD2H7xL2mlztI7tmQu9ucIGPTSPgYi2Af0N68BXDdXONFISqhUrKhlxxApKJREhQOzmV51jkEDZbQrYpNifMW5jli69Z-Mz9cyuM"/>
<span class="font-body font-semibold text-sm">Continue with Google</span>
</button>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container text-on-surface py-3.5 px-4 rounded-full transition-colors duration-200 group">
<img alt="Apple" class="w-5 h-5 group-hover:scale-110 transition-transform" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDkcQ7x7u01apM63tnl7dKarbq4lKOiqYF4X-DOxdirL0T2bYWvqHK_Mf84gJv0mgaTI632qH18Vp3Cs6KVZR1XbppP05qUyge66HlgYdM1mLJXWmYNXwPSkNeOmh0hVEYBkKDljw3I8jAFXLjntfNZ-MzlIIe_-KYKIOG5suE3PCl85fgYblnJ8WxuSpWxVnr5dZLoDJLx49Mzvlg7aYrq5K7Ea9XRn1ilP-ur6CG6CoBD0RUHIkm_SefrIXFLTbHDgQO0NM0QddM"/>
<span class="font-body font-semibold text-sm">Continue with Apple</span>
</button>
</div>
<div class="flex items-center gap-4 mb-8">
<div class="flex-1 h-px bg-outline-variant/30"></div>
<span class="font-label text-xs uppercase tracking-widest text-on-surface-variant">Or sign in with email</span>
<div class="flex-1 h-px bg-outline-variant/30"></div>
</div>
<!-- Email/Password Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="relative">
<input class="peer w-full bg-surface-container-high text-on-surface font-body px-5 pt-6 pb-2 rounded-DEFAULT border-none focus:ring-1 focus:ring-primary/50 focus:bg-surface-container-lowest transition-all placeholder-transparent" id="email" placeholder="name@example.com" required="" type="email"/>
<label class="absolute left-5 top-4 text-on-surface-variant font-label text-xs font-semibold tracking-wide transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary" for="email">
                            EMAIL ADDRESS
                        </label>
</div>
<!-- Password Field -->
<div class="relative">
<input class="peer w-full bg-surface-container-high text-on-surface font-body px-5 pt-6 pb-2 rounded-DEFAULT border-none focus:ring-1 focus:ring-primary/50 focus:bg-surface-container-lowest transition-all placeholder-transparent" id="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-5 top-4 text-on-surface-variant font-label text-xs font-semibold tracking-wide transition-all peer-placeholder-shown:text-base peer-placeholder-shown:top-4 peer-focus:top-2 peer-focus:text-xs peer-focus:text-primary" for="password">
                            PASSWORD
                        </label>
<button class="absolute right-5 top-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-body text-sm font-semibold text-secondary hover:text-secondary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg py-4 rounded-full shadow-[0_10px_20px_-10px_rgba(172,45,94,0.4)] hover:shadow-[0_15px_25px_-10px_rgba(172,45,94,0.5)] transform hover:-translate-y-0.5 transition-all duration-300" type="submit">
                        Login
                    </button>
</form>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<p class="font-body text-sm text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-semibold text-primary hover:text-primary-dim transition-colors ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</main>
</body></html>
