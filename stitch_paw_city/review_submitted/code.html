<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-center items-center p-6 relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-primary-container/20 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-secondary-container/30 rounded-full blur-[60px] -z-10 pointer-events-none"></div>
<main class="w-full max-w-md flex flex-col items-center text-center">
<!-- Success Icon -->
<div class="w-32 h-32 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-center shadow-[0_20px_40px_rgba(172,45,94,0.15)] mb-8 relative">
<div class="absolute inset-0 rounded-full border-4 border-surface-container-lowest/50 scale-110"></div>
<span class="material-symbols-outlined text-on-primary text-6xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Typography -->
<h1 class="text-[2.5rem] font-bold text-on-surface mb-4 tracking-tight leading-tight">Thank You!</h1>
<p class="text-[1rem] text-on-surface-variant leading-relaxed mb-12 max-w-[280px]">
            Your review helps other pet parents make the best choices for their furry friends.
        </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-semibold py-4 rounded-full shadow-[0_8px_24px_rgba(172,45,94,0.2)] hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl" data-icon="shopping_bag">shopping_bag</span>
                Go Back to Shop
            </button>
<button class="w-full bg-surface-container-low text-primary font-medium py-4 rounded-full hover:bg-surface-container transition-colors flex items-center justify-center gap-2 border border-outline-variant/15">
<span class="material-symbols-outlined text-xl" data-icon="star">star</span>
                View Your Reviews
            </button>
</div>
