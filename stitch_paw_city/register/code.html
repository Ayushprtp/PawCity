<div>
<div class="text-4xl font-extrabold tracking-tighter text-on-primary drop-shadow-md">Paw City</div>
</div>
<div class="max-w-md">
<h2 class="text-display-lg font-headline font-bold leading-tight mb-4 drop-shadow-lg">Join the ultimate pet community.</h2>
<p class="text-body-md font-body text-on-primary/90">Connect, care, and celebrate every moment with your furry companion.</p>
</div>
</div>
</div>
<!-- Right/Bottom Section: Form Area -->
<div class="w-full md:w-1/2 lg:w-2/5 flex flex-col justify-center px-6 py-12 md:px-12 lg:px-20 bg-surface z-10 rounded-t-xl md:rounded-t-none -mt-6 md:mt-0 shadow-[0_-20px_40px_-15px_rgba(0,0,0,0.1)] md:shadow-none relative">
<div class="max-w-md w-full mx-auto space-y-8">
<!-- Mobile Brand Header -->
<div class="md:hidden text-center mb-8">
<div class="text-3xl font-extrabold tracking-tighter text-primary">Paw City</div>
</div>
<!-- Header -->
<div class="space-y-2">
<h1 class="text-3xl font-headline font-bold text-on-background">Create Account</h1>
<p class="text-body-md text-on-surface-variant font-body">Let's start your journey with your pet.</p>
</div>
<!-- Form -->
<form class="space-y-6">
<div class="space-y-4">
<!-- Full Name -->
<div>
<label class="block text-label-sm font-label uppercase tracking-wider text-on-surface-variant mb-1" for="name">Full Name</label>
<input class="appearance-none block w-full px-4 py-3 bg-surface-container-high border-0 rounded-DEFAULT text-on-background focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors placeholder:text-on-surface-variant/50" id="name" name="name" placeholder="e.g. Jane Doe" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block text-label-sm font-label uppercase tracking-wider text-on-surface-variant mb-1" for="email">Email Address</label>
<input autocomplete="email" class="appearance-none block w-full px-4 py-3 bg-surface-container-high border-0 rounded-DEFAULT text-on-background focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block text-label-sm font-label uppercase tracking-wider text-on-surface-variant mb-1" for="password">Password</label>
<input autocomplete="new-password" class="appearance-none block w-full px-4 py-3 bg-surface-container-high border-0 rounded-DEFAULT text-on-background focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-center">
<input class="h-5 w-5 text-primary bg-surface-container-high border-0 rounded focus:ring-primary focus:ring-offset-surface" id="terms" name="terms" required="" type="checkbox"/>
<label class="ml-3 block text-body-md text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary hover:text-primary-dim font-medium transition-colors" href="#">Terms of Service</a>
</label>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-4 px-4 border border-transparent rounded-full shadow-[0_10px_30px_-10px_rgba(172,45,94,0.4)] text-body-md font-bold text-on-primary bg-gradient-to-r from-primary to-primary-container hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Divider -->
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface text-on-surface-variant font-label text-label-sm uppercase tracking-wider">Or continue with</span>
</div>
</div>
<!-- Social Sign Up -->
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="w-full flex justify-center py-3 px-4 rounded-full bg-surface-container border-0 hover:bg-surface-container-high transition-colors text-on-surface font-medium text-body-md items-center gap-2" type="button">

<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>

</svg>

</svg>

<p class="mt-8 text-center text-body-md text-on-surface-variant">
                Already have an account?

</p>
