<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Health &amp; Activity - Paw City</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ac2d5e",
                        "error": "#ac3149",
                        "surface-container-high": "#e5e9eb",
                        "on-surface": "#2e3335",
                        "on-surface-variant": "#5a6062",
                        "on-primary-fixed-variant": "#890c44",
                        "on-background": "#2e3335",
                        "surface-bright": "#f8f9fa",
                        "secondary": "#00639f",
                        "on-error": "#fff7f7",
                        "error-dim": "#770326",
                        "secondary-fixed": "#cfe5ff",
                        "tertiary-dim": "#744a00",
                        "inverse-on-surface": "#9b9d9e",
                        "tertiary-container": "#feb64c",
                        "outline-variant": "#aeb3b5",
                        "on-tertiary-fixed": "#3d2500",
                        "outline": "#767c7e",
                        "secondary-fixed-dim": "#b5d8ff",
                        "surface-container-highest": "#dee3e5",
                        "primary-fixed-dim": "#ff92b2",
                        "surface-variant": "#dee3e5",
                        "tertiary": "#845500",
                        "on-error-container": "#68001f",
                        "on-primary": "#fff7f7",
                        "tertiary-fixed": "#feb64c",
                        "inverse-primary": "#fd6c9c",
                        "error-container": "#f76a80",
                        "surface-container-low": "#f2f4f5",
                        "on-secondary-fixed-variant": "#005f99",
                        "on-tertiary-container": "#583700",
                        "inverse-surface": "#0c0f10",
                        "secondary-container": "#cfe5ff",
                        "on-tertiary-fixed-variant": "#644000",
                        "on-secondary": "#f7f9ff",
                        "surface-tint": "#ac2d5e",
                        "on-primary-fixed": "#550027",
                        "primary-container": "#ffa8c0",
                        "background": "#f8f9fa",
                        "secondary-dim": "#00578c",
                        "surface-container": "#ebeef0",
                        "surface": "#f8f9fa",
                        "primary-dim": "#9c1f52",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#eea840",
                        "surface-dim": "#d5dbdd",
                        "on-secondary-fixed": "#00426c",
                        "primary-fixed": "#ffa8c0",
                        "on-tertiary": "#fff7f3",
                        "on-secondary-container": "#005589",
                        "on-primary-container": "#7c003b"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ac2d5e;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 4px 10px rgba(172, 45, 94, 0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #ffa8c0;
            border-radius: 9999px;
        }
        
        /* Custom Toggle Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #ac2d5e;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #ac2d5e;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Intent is Onboarding (Linear/Transactional) -> Suppressing TopAppBar and BottomNavBar as per Mandate -->
<!-- Ambient Background Blur -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-primary-container opacity-20 blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-secondary-container opacity-20 blur-[120px]"></div>
</div>
<main class="flex-grow flex flex-col items-center justify-center p-6 md:p-12 z-10 w-full max-w-3xl mx-auto">
<!-- Header & Progress -->
<div class="w-full mb-10">
<div class="flex items-center justify-between mb-8">
<button aria-label="Go back" class="p-3 rounded-full bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors shadow-[0_20px_40px_rgba(46,51,53,0.06)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="text-right">
<span class="font-label text-xs tracking-widest text-secondary font-bold uppercase">Step 3 of 4</span>
</div>
</div>
<h1 class="font-headline text-[3.5rem] leading-tight font-extrabold text-on-surface mb-4 tracking-tight">Health Goals.</h1>
<p class="font-body text-[0.875rem] text-on-surface-variant max-w-md">Let's set a healthy baseline to tailor their nutrition and activity recommendations.</p>
</div>
<!-- Main Form Container - Asymmetrical layering -->
<div class="w-full relative">
<!-- Decorative image offset -->
<div class="hidden md:block absolute -right-12 -top-12 w-48 h-48 rounded-xl rounded-tl-xl rounded-br-xl overflow-hidden z-0 shadow-[0_30px_60px_rgba(46,51,53,0.08)]">
<img alt="Playful dog running in a sunny park with soft green grass" class="w-full h-full object-cover" data-alt="Playful golden retriever running in a sunlit park with soft green grass and warm golden hour lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAuHO3DR0t2aY7S2tNnaivtEShI2qoZr1lzQm1rc_jx1SbdEfGOnSRJbiQosGT-w8IROa0li4lnWIWLkV846hpCHdlQ8-f0ciRHmjFEY9uSk5xitdagk5t2jgJ1och4-3ZsiLippmI-6i8KuNwEyG6TsgLNO0D2UDAG9qBD-tDOdOag-wuuxfD2Oy9vWP7vlbCxQNezQIaYwXGSuPky_6ORm7DLudh9wqE2qqqo6wze_4imlt1dh1gmtqDWDN16ekeE_HjQ00Ov-mo"/>
</div>
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_20px_40px_rgba(46,51,53,0.04)] relative z-10">
<!-- Weight Section -->
<div class="mb-12">
<div class="flex justify-between items-end mb-6">
<div>
<h2 class="font-headline text-[1.5rem] font-bold text-on-surface">Current Weight</h2>
<p class="font-body text-sm text-on-surface-variant">Estimate is fine for now.</p>
</div>
<div class="flex items-center space-x-2 bg-surface-container-high p-1 rounded-full">
<button class="px-4 py-1.5 rounded-full bg-surface-container-lowest text-primary font-bold shadow-sm text-sm transition-colors">lbs</button>
<button class="px-4 py-1.5 rounded-full text-on-surface-variant hover:text-on-surface font-medium text-sm transition-colors">kg</button>
</div>
</div>
<div class="bg-surface-container-low rounded-lg p-8 relative">
<div class="text-center mb-6">
<span class="font-headline text-5xl font-extrabold text-primary">32<span class="text-2xl text-primary-dim font-bold ml-1">lbs</span></span>
</div>
<div class="relative w-full">
<input class="w-full" max="150" min="1" type="range" value="32"/>
<div class="flex justify-between text-xs font-label text-outline-variant mt-3 px-2 uppercase tracking-wider">
<span>1 lbs</span>
<span>150+ lbs</span>
</div>
</div>
</div>
</div>
<!-- Activity Level Section -->
<div class="mb-12">
<div class="mb-6">
<h2 class="font-headline text-[1.5rem] font-bold text-on-surface">Activity Level</h2>
<p class="font-body text-sm text-on-surface-variant">How energetic is their daily routine?</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Low -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="activity" type="radio" value="low"/>
<div class="h-full bg-surface border-2 border-transparent rounded-DEFAULT p-6 text-center transition-all duration-300 peer-checked:bg-surface-container-lowest peer-checked:border-primary/20 peer-checked:shadow-[0_10px_30px_rgba(172,45,94,0.08)] group-hover:bg-surface-container">
<span class="material-symbols-outlined text-4xl text-outline-variant mb-3 peer-checked:text-primary transition-colors" style="font-variation-settings: 'FILL' 1;">bed</span>
<h3 class="font-headline font-bold text-on-surface mb-1">Couch Potato</h3>
<p class="text-xs text-on-surface-variant">Short walks, mostly resting.</p>
</div>
</label>
<!-- Moderate -->
<label class="cursor-pointer group">
<input checked="" class="peer sr-only" name="activity" type="radio" value="moderate"/>
<div class="h-full bg-surface border-2 border-transparent rounded-DEFAULT p-6 text-center transition-all duration-300 peer-checked:bg-surface-container-lowest peer-checked:border-primary/20 peer-checked:shadow-[0_10px_30px_rgba(172,45,94,0.08)] group-hover:bg-surface-container">
<span class="material-symbols-outlined text-4xl text-primary mb-3 transition-colors" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
<h3 class="font-headline font-bold text-on-surface mb-1">Active</h3>
<p class="text-xs text-on-surface-variant">Daily walks, regular play.</p>
</div>
</label>
<!-- High -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="activity" type="radio" value="high"/>
<div class="h-full bg-surface border-2 border-transparent rounded-DEFAULT p-6 text-center transition-all duration-300 peer-checked:bg-surface-container-lowest peer-checked:border-primary/20 peer-checked:shadow-[0_10px_30px_rgba(172,45,94,0.08)] group-hover:bg-surface-container">
<span class="material-symbols-outlined text-4xl text-outline-variant mb-3 peer-checked:text-primary transition-colors" style="font-variation-settings: 'FILL' 1;">sprint</span>
<h3 class="font-headline font-bold text-on-surface mb-1">Athlete</h3>
<p class="text-xs text-on-surface-variant">Runs, intense daily exercise.</p>
</div>
</label>
</div>
</div>
<!-- Spayed/Neutered Toggle -->
<div class="bg-secondary-container/30 rounded-DEFAULT p-6 flex items-center justify-between">
<div>
<h2 class="font-headline font-bold text-on-surface text-lg">Spayed / Neutered?</h2>
<p class="font-body text-xs text-on-surface-variant mt-1">This affects calorie calculations.</p>
</div>
<div class="relative inline-block w-14 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-7 h-7 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out peer" id="toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-7 rounded-full bg-outline-variant cursor-pointer peer-checked:bg-primary transition-colors duration-200" for="toggle"></label>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="w-full mt-12 flex justify-between items-center">
<button class="font-label font-bold text-on-surface-variant hover:text-on-surface transition-colors px-6 py-3 tracking-wide text-sm">SKIP FOR NOW</button>
<button class="bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold px-10 py-4 rounded-full shadow-[0_10px_30px_rgba(172,45,94,0.2)] hover:shadow-[0_15px_40px_rgba(172,45,94,0.3)] hover:-translate-y-1 transition-all duration-300 flex items-center gap-2">
                CONTINUE
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
</body></html>
