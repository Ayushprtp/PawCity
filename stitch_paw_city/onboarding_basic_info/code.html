<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Tell us about your pet</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#ac2d5e",
                    "error": "#ac3149",
                    "surface-container-high": "#e5e9eb",
                    "on-surface": "#2e3335",
                    "on-surface-variant": "#5a6062",
                    "on-primary-fixed-variant": "#890c44",
                    "on-background": "#2e3335",
                    "surface-bright": "#f8f9fa",
                    "secondary": "#00639f",
                    "on-error": "#fff7f7",
                    "error-dim": "#770326",
                    "secondary-fixed": "#cfe5ff",
                    "tertiary-dim": "#744a00",
                    "inverse-on-surface": "#9b9d9e",
                    "tertiary-container": "#feb64c",
                    "outline-variant": "#aeb3b5",
                    "on-tertiary-fixed": "#3d2500",
                    "outline": "#767c7e",
                    "secondary-fixed-dim": "#b5d8ff",
                    "surface-container-highest": "#dee3e5",
                    "primary-fixed-dim": "#ff92b2",
                    "surface-variant": "#dee3e5",
                    "tertiary": "#845500",
                    "on-error-container": "#68001f",
                    "on-primary": "#fff7f7",
                    "tertiary-fixed": "#feb64c",
                    "inverse-primary": "#fd6c9c",
                    "error-container": "#f76a80",
                    "surface-container-low": "#f2f4f5",
                    "on-secondary-fixed-variant": "#005f99",
                    "on-tertiary-container": "#583700",
                    "inverse-surface": "#0c0f10",
                    "secondary-container": "#cfe5ff",
                    "on-tertiary-fixed-variant": "#644000",
                    "on-secondary": "#f7f9ff",
                    "surface-tint": "#ac2d5e",
                    "on-primary-fixed": "#550027",
                    "primary-container": "#ffa8c0",
                    "background": "#f8f9fa",
                    "secondary-dim": "#00578c",
                    "surface-container": "#ebeef0",
                    "surface": "#f8f9fa",
                    "primary-dim": "#9c1f52",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-fixed-dim": "#eea840",
                    "surface-dim": "#d5dbdd",
                    "on-secondary-fixed": "#00426c",
                    "primary-fixed": "#ffa8c0",
                    "on-tertiary": "#fff7f3",
                    "on-secondary-container": "#005589",
                    "on-primary-container": "#7c003b"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans", "sans-serif"],
                    "body": ["Plus Jakarta Sans", "sans-serif"],
                    "label": ["Plus Jakarta Sans", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined[data-weight="fill"] {
        font-variation-settings: 'FILL' 1;
      }
      
      /* Input overrides to match design system focus states */
      input:focus, select:focus {
        background-color: var(--tw-colors-surface-container-lowest);
        border-color: rgba(172, 45, 94, 0.2); /* primary with 20% opacity */
        outline: none;
        box-shadow: none;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation for Onboarding (Simplified, transactional) -->
<header class="w-full px-6 py-4 flex items-center justify-between bg-surface/80 backdrop-blur-xl z-50 fixed top-0 left-0">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-2xl">arrow_back</span>
</button>
<div class="text-xl font-extrabold text-primary tracking-tighter">Paw City</div>
<div class="w-10 h-10"></div> <!-- Spacer for flex alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-6 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Decorative organic shape background -->
<div class="absolute top-0 right-0 -mr-32 -mt-32 w-96 h-96 bg-primary-container/20 rounded-full blur-3xl -z-10"></div>
<div class="absolute bottom-0 left-0 -ml-32 -mb-32 w-80 h-80 bg-secondary-container/30 rounded-full blur-3xl -z-10"></div>
<div class="w-full max-w-md flex flex-col gap-8">
<!-- Progress Indicator (Step 2 of 4) -->
<div class="flex flex-col gap-2 w-full">
<div class="flex justify-between text-label-sm font-label text-on-surface-variant tracking-widest uppercase text-[10px] font-bold">
<span>Step 2</span>
<span>Basic Info</span>
</div>
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-2/4 bg-primary rounded-full"></div>
</div>
</div>
<!-- Headline Section -->
<div class="flex flex-col gap-3 relative">
<!-- Organic overlapping image element -->
<div class="absolute -top-12 -right-4 w-20 h-20 rounded-full border-4 border-surface overflow-hidden shadow-[0_20px_40px_rgba(0,0,0,0.06)] z-10" style="border-radius: 3rem 1rem 3rem 1rem;">
<img alt="Cute cat" class="w-full h-full object-cover" data-alt="Close up portrait of a fluffy ginger kitten looking directly at camera with soft natural lighting and blurred background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZg67Byj5ToARwCCqLj0eKnVwTelc4ZRo2fkyfDFpu6PP59S0ylq2JZLpdA_J9xhYzI8EObJ8nlaMohq3bqKhoGRF5fqsINOLu5dnsx3I2VgmRvX-qI9UO7ncTLb5ld--aoPeKAs2BDugtv0nvuuKQiRWDcQxnllGYuRMvW7DSqwVW8TwXptx92NzIVd8GtWzri3FQjxje0YuFOsHgmBPRBylg0mjDZXPm6J65n06m3Wv4nirtLxw4A0-1Z4erg3T-9ECWzL_f0Ac"/>
</div>
<h1 class="font-headline text-[2.5rem] leading-tight font-extrabold text-on-surface tracking-tight w-4/5">
                    Tell us about your pet
                </h1>
<p class="font-body text-on-surface-variant text-base">
                    Let's start with the basics to personalize their experience.
                </p>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-6 bg-surface-container-low p-6 rounded-DEFAULT shadow-[0_10px_30px_rgba(0,0,0,0.03)] relative">
<!-- Pet Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label text-label-sm uppercase tracking-widest text-[10px] font-bold text-on-surface-variant" for="petName">Pet Name</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-high border-none rounded-DEFAULT px-4 font-body text-base text-on-surface placeholder:text-outline-variant transition-all duration-300" id="petName" placeholder="e.g. Bella, Max..." type="text"/>
</div>
</div>
<!-- Breed Field (Dropdown/Autocomplete simulation) -->
<div class="flex flex-col gap-2">
<label class="font-label text-label-sm uppercase tracking-widest text-[10px] font-bold text-on-surface-variant" for="petBreed">Breed</label>
<div class="relative">
<select class="w-full h-14 bg-surface-container-high border-none rounded-DEFAULT px-4 font-body text-base text-on-surface appearance-none transition-all duration-300" id="petBreed">
<option class="text-outline-variant" disabled="" selected="" value="">Select or type breed...</option>
<option value="golden">Golden Retriever</option>
<option value="frenchie">French Bulldog</option>
<option value="poodle">Poodle</option>
<option value="siamese">Siamese Cat</option>
<option value="mixed">Mixed / Unknown</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Birthday/Age Group -->
<div class="flex flex-col gap-2">
<label class="font-label text-label-sm uppercase tracking-widest text-[10px] font-bold text-on-surface-variant">Birthday or Age</label>
<div class="flex gap-4">
<div class="relative flex-1">
<input class="w-full h-14 bg-surface-container-high border-none rounded-DEFAULT px-4 font-body text-base text-on-surface transition-all duration-300" id="petBirthday" type="date"/>
</div>
<div class="flex items-center justify-center px-2 text-on-surface-variant font-body text-sm">OR</div>
<div class="relative flex-1">
<input class="w-full h-14 bg-surface-container-high border-none rounded-DEFAULT px-4 font-body text-base text-on-surface placeholder:text-outline-variant transition-all duration-300" id="petAge" max="30" min="0" placeholder="Years" type="number"/>
</div>
</div>
</div>
<!-- Pet Type Selection (Bento-style radio buttons) -->
<div class="flex flex-col gap-2 mt-2">
<label class="font-label text-label-sm uppercase tracking-widest text-[10px] font-bold text-on-surface-variant">Pet Type</label>
<div class="grid grid-cols-2 gap-4">
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="petType" type="radio" value="dog"/>
<div class="flex flex-col items-center justify-center p-4 bg-surface-container-high rounded-DEFAULT border-2 border-transparent peer-checked:border-primary/20 peer-checked:bg-surface-container-lowest transition-all duration-300 h-24">
<span class="material-symbols-outlined text-3xl mb-1 text-on-surface-variant peer-checked:text-primary transition-colors">pets</span>
<span class="font-body text-sm font-medium text-on-surface-variant peer-checked:text-primary transition-colors">Dog</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="petType" type="radio" value="cat"/>
<div class="flex flex-col items-center justify-center p-4 bg-surface-container-high rounded-DEFAULT border-2 border-transparent peer-checked:border-primary/20 peer-checked:bg-surface-container-lowest transition-all duration-300 h-24">
<span class="material-symbols-outlined text-3xl mb-1 text-on-surface-variant peer-checked:text-primary transition-colors">cruelty_free</span>
<span class="font-body text-sm font-medium text-on-surface-variant peer-checked:text-primary transition-colors">Cat</span>
</div>
</label>
</div>
</div>
</form>
</div>
</main>
<!-- Bottom Action Bar (Transactional Flow) -->
<footer class="fixed bottom-0 left-0 w-full p-6 bg-surface-container-lowest/80 backdrop-blur-xl border-t border-outline-variant/15 z-50 flex items-center justify-between">
<button class="px-6 py-4 rounded-full font-body font-semibold text-on-surface-variant hover:bg-surface-container transition-colors">
            Skip for now
        </button>
<button class="px-8 py-4 rounded-full font-body font-bold text-on-primary bg-gradient-to-br from-primary to-primary-container shadow-[0_10px_20px_rgba(172,45,94,0.2)] hover:shadow-[0_15px_30px_rgba(172,45,94,0.3)] hover:-translate-y-0.5 transition-all duration-300 flex items-center gap-2">
            Continue
            <span class="material-symbols-outlined text-sm" data-weight="fill">arrow_forward</span>
</button>
</footer>
</body></html>
