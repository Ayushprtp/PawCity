<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<!-- Top App Bar (Suppressed Navbar logic - Using simpler header for onboarding) -->
<header class="w-full px-6 py-6 flex items-center justify-between z-10 relative">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors shadow-[0_4px_20px_rgba(46,51,53,0.06)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-headline font-bold text-primary tracking-tighter text-xl">Paw City</span>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-6 pb-12 pt-2 max-w-md mx-auto w-full relative z-10">
<!-- Progress Bar -->
<div aria-label="Progress: Step 4 of 4" class="w-full flex items-center gap-2 mb-8">
<div class="h-2 flex-1 rounded-full bg-primary/20 overflow-hidden">
<div class="h-full bg-primary w-full rounded-full"></div>
</div>
<div class="h-2 flex-1 rounded-full bg-primary/20 overflow-hidden">
<div class="h-full bg-primary w-full rounded-full"></div>
</div>
<div class="h-2 flex-1 rounded-full bg-primary/20 overflow-hidden">
<div class="h-full bg-primary w-full rounded-full"></div>
</div>
<div class="h-2 flex-1 rounded-full bg-primary/20 overflow-hidden">
<div class="h-full bg-primary w-full rounded-full"></div>
</div>
</div>
<!-- Header -->
<div class="mb-10 text-left">
<h1 class="text-3xl font-headline font-extrabold text-on-surface tracking-tight mb-3">Almost done!</h1>
<p class="text-base font-body text-on-surface-variant leading-relaxed">Add a photo to personalize their profile. You can always change this later.</p>
</div>
<!-- Photo Upload Area -->
<div class="flex-1 flex flex-col items-center justify-center mb-12">
<!-- Circular Placeholder -->
<div class="relative mb-8 group cursor-pointer">
<!-- Outer Decorative Ring -->
<div class="absolute inset-0 rounded-full bg-primary-container/30 scale-110 -z-10 group-hover:scale-125 transition-transform duration-500 ease-out"></div>
<!-- Main Circle -->
<div class="w-48 h-48 rounded-full bg-surface-container-highest flex flex-col items-center justify-center border-4 border-surface-container-lowest shadow-[0_20px_40px_rgba(46,51,53,0.06)] overflow-hidden relative">
<!-- Inner content (when empty) -->
<span class="material-symbols-outlined text-outline-variant text-6xl mb-2" style="font-variation-settings: 'FILL' 0;">pets</span>
<span class="text-xs font-label font-bold text-on-surface-variant tracking-widest uppercase">Add Photo</span>
<!-- Overlay for hover -->
<div class="absolute inset-0 bg-primary/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
</div>
<!-- Floating Badge -->
<div class="absolute bottom-2 right-2 w-12 h-12 bg-surface-container-lowest rounded-full shadow-[0_10px_20px_rgba(46,51,53,0.08)] flex items-center justify-center text-primary z-20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full gap-4 max-w-[280px]">
<button class="w-full flex items-center justify-center gap-3 py-4 px-6 bg-surface-container-lowest rounded-full shadow-[0_8px_20px_rgba(46,51,53,0.04)] text-on-surface font-headline font-bold hover:bg-surface-container-low transition-colors border border-outline-variant/15">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">photo_library</span>
                    Upload from Gallery
                </button>
<button class="w-full flex items-center justify-center gap-3 py-4 px-6 bg-surface-container-lowest rounded-full shadow-[0_8px_20px_rgba(46,51,53,0.04)] text-on-surface font-headline font-bold hover:bg-surface-container-low transition-colors border border-outline-variant/15">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
                    Take a Photo
                </button>
</div>
</div>
<!-- Bottom Primary Action -->
<div class="mt-auto pt-4">
<button class="w-full py-4 px-8 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full font-headline font-extrabold text-lg shadow-[0_15px_30px_rgba(172,45,94,0.2)] hover:shadow-[0_20px_40px_rgba(172,45,94,0.3)] hover:-translate-y-1 transition-all duration-300 flex justify-center items-center gap-2">
                All Set!
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</div>

<!-- Decorative Background Element (Organic Asymmetry) -->
<div class="fixed top-0 right-0 w-[150vw] h-[150vw] md:w-[80vw] md:h-[80vw] bg-secondary-container/20 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/3 pointer-events-none -z-10"></div>
<div class="fixed bottom-0 left-0 w-[100vw] h-[100vw] md:w-[60vw] md:h-[60vw] bg-primary-container/10 rounded-full blur-[60px] translate-y-1/3 -translate-x-1/4 pointer-events-none -z-10"></div>
